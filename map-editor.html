<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Редактор карты · Drone Commander</title>
    <link rel="icon" href="Drone Commander.png">
    <link rel="stylesheet" href="map-editor.css">
    <script src="libs/three.min.js"></script>
    <script src="libs/MTLLoader.js"></script>
    <script src="libs/OBJLoader.js"></script>
  </head>
  <body>
    <header class="editor-header">
      <a class="brand-mark" href="index.html" aria-label="Drone Commander">DC</a>
      <label class="map-name-wrap">
        <span id="mapNameLabel"></span>
        <input id="mapNameInput" type="text" maxlength="80">
      </label>
      <div class="header-actions">
        <button id="applyMapBtn" class="primary-action" type="button"></button>
        <button id="closeMapBtn" type="button"></button>
      </div>
    </header>

    <main class="editor-layout">
      <aside class="object-sidebar" aria-labelledby="objectsHeading">
        <div class="section-heading">
          <h1 id="objectsHeading"></h1>
          <span id="objectCount" class="count-badge">0</span>
        </div>
        <div class="asset-picker">
          <label for="modelSelect" id="modelSelectLabel"></label>
          <select id="modelSelect"></select>
          <button id="addObjectBtn" type="button"></button>
        </div>
        <ul id="objectList" class="object-list"></ul>
      </aside>

      <section class="viewport-section" aria-label="3D map view">
        <div class="viewport-toolbar">
          <span id="viewportTitle"></span>
          <span id="editorStatus" role="status" aria-live="polite"></span>
          <button id="resetCameraBtn" type="button" title="Reset camera"></button>
        </div>
        <div id="mapViewport">
          <div id="viewportMessage" hidden></div>
        </div>
      </section>

      <aside class="inspector-sidebar">
        <section class="inspector-section" aria-labelledby="surfaceHeading">
          <h2 id="surfaceHeading"></h2>
          <label for="textureSelect" id="textureLabel"></label>
          <select id="textureSelect"></select>
          <label for="hillHeightInput" id="hillHeightLabel"></label>
          <input id="hillHeightInput" type="number" min="0" max="1000" step="0.1">
        </section>

        <section class="inspector-section" aria-labelledby="transformHeading">
          <h2 id="transformHeading"></h2>
          <p id="emptySelection"></p>
          <div id="transformFields" hidden>
            <div class="transform-group">
              <h3 id="positionHeading"></h3>
              <div class="axis-fields">
                <label>X<input data-transform="position.x" type="number" step="0.1"></label>
                <label>Y<input data-transform="position.y" type="number" step="0.1"></label>
                <label>Z<input data-transform="position.z" type="number" step="0.1"></label>
              </div>
            </div>
            <div class="transform-group">
              <h3 id="rotationHeading"></h3>
              <div class="axis-fields">
                <label>X<input data-transform="rotation.x" type="number" step="1"></label>
                <label>Y<input data-transform="rotation.y" type="number" step="1"></label>
                <label>Z<input data-transform="rotation.z" type="number" step="1"></label>
              </div>
            </div>
            <label class="scale-field" for="scaleInput" id="scaleLabel"></label>
            <input id="scaleInput" data-transform="scale" type="number" min="0.01" step="0.1">
            <button id="removeObjectBtn" class="danger-action" type="button"></button>
          </div>
        </section>
      </aside>
    </main>
    <script src="js/map-editor.js"></script>
  </body>
</html>
