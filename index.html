<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="Drone Commander.svg">
    <title>Drone Commander</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include Blockly -->
    <script src="libs/blockly_compressed.min.js"></script>
    <script src="libs/blocks_compressed.min.js"></script>
    <script src="libs/Msg/en.js"></script>
    <script src="libs/javascript_compressed.min.js"></script>
    <!-- Include Three.js -->
    <script src="libs/three.min.js"></script>
    <script src="libs/STLLoader.js"></script>  
    <script src="libs/MTLLoader.js"></script>  
    <script src="libs/OBJLoader.js"></script>  
    
  </head>
  <body>
    <div id="container">
      <div id="leftPanel">
        <div id="menu">
          <img src="Drone Commander.svg" width="64px">    
          <select id="languageSelect">
            <option value="ru">Русский</option>
            <option value="en">English</option>
            <option value="it">Italiano</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="pt">Português</option>
            <option value="ar">العربية</option>
            <option value="zh">简体中文</option>
            <option value="ko">한국어</option>
            <option value="ja">日本語</option>
          </select>
          <button id="newBtn">New</button>
          <button id="loadBtn">Load</button>
          <button id="saveBtn">Save</button>
          <div id="scenarioControls">
            <select id="scenarioSelect">
              <option value=""></option>
            </select>
            <select id="graphicsSelect">
              <option value="performance"></option>
              <option value="balanced"></option>
              <option value="quality"></option>
            </select>
            <button id="helpBtn"></button>
          </div>
          <label id="darkThemeControl" for="darkThemeToggle">
            <input type="checkbox" id="darkThemeToggle">
            <span id="labelDarkTheme">Dark theme</span>
          </label>

          <input type="file" id="fileInput" style="display:none">
        </div>
        <div id="blocklyDiv"></div>
      </div>
      <div id="divider"></div>
      <div id="rightPanel">
        <div id="viewerToolbar">
          <button id="toggleWebglBtn" >🗖</button>
          <span id="fileNameLabel"></span>
          <label id="cameraPreviewControl" for="cameraPreviewToggle">
            <input type="checkbox" id="cameraPreviewToggle" checked>
            <span id="labelCameraPreview">Camera preview</span>
          </label>
          <button id="runBtn">▶</button>
          <button id="stopBtn" disabled>■</button>
        </div>
        <div id="webglContainer">
          <div id="droneCameraPanel"></div>
        </div>
        <div id="statusPanel">
          <table>
            <tr>
              <td id="labelX">X:</td><td><input type="number" id="x" value="0" step="0.1"></td>
              <td id="labelZ">Z:</td><td><input type="number" id="z" value="0" step="0.1"></td>
            </tr>
            <tr>
              <td id="labelAlt">Altitude:</td><td><input type="number" id="altitude" value="1.5" step="0.1"></td>
              <td id="labelDir">Direction:</td><td><input type="number" id="direction" value="0" step="1"></td>
            </tr>
            <tr>
              <td colspan="2"><span id="labelStatus">Status:</span> <span id="flightStatus">On Ground</span></td>
            </tr>
            <tr id="variablesRow">
              <td colspan="4">
                <div id="labelVariables">Variables:</div>
                <div id="variableValues">—</div>
              </td>
            </tr>
            <tr id="mediaSaveDirectoryRow" hidden>
              <td colspan="4">
                <label id="labelMediaSaveDirectory" for="mediaSaveDirectoryPath">
                  Photo/video folder:
                </label>
                <div id="mediaSaveDirectoryFields">
                  <input type="text" id="mediaSaveDirectoryPath" readonly>
                  <button type="button" id="selectMediaSaveDirectoryBtn">Choose...</button>
                  <button type="button" id="resetMediaSaveDirectoryBtn">Reset</button>
                </div>
              </td>
            </tr>
          </table>
        </div>
      </div>
    </div>
    
    <script src="js/blockly.js"></script>
    <script src="js/drone-commands.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
